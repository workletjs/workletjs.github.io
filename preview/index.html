  <head><script data-ng-doc-theme-restore>// Restores the reader's theme before the application starts. An empty stored id is the light

  const documentElement = document.documentElement;

  if (themeId) {
    documentElement.setAttribute('data-theme', themeId);
  } else {
    documentElement.removeAttribute('data-theme');
  }
}
